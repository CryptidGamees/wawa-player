name: Build installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install PySide6 python-mpv mutagen pyinstaller

      - name: Build the app
        run: pyinstaller --noconfirm --onedir --windowed --name WawaPlayer --icon icon.ico --add-data "icon.ico;." --hidden-import mpv musicplayer.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: WawaPlayer-Setup
          path: output/WawaPlayer-Setup.exe
