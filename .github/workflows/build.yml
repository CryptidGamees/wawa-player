name: Build installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install PySide6 python-mpv py7zr mutagen pyinstaller

      - name: Build the app
        run: pyinstaller --noconfirm --onedir --windowed --name GlassPlayer --hidden-import mpv --collect-all py7zr --collect-all pyppmd --collect-all bcj --collect-all inflate64 musicplayer.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-Setup
          path: output/GlassPlayer-Setup.exe
